<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paralaxe</title>
<meta name="description" content="Desenvolvemos sistemas de gestão sob medida, sites, aplicativos, agentes de IA e automações para qualquer ramo. Licença mensal, hospedagem dedicada e preço justo.">
<meta name="theme-color" content="#050505">
<link rel="canonical" href="https://paralaxestudio.com.br/pt/">
<link rel="alternate" hreflang="pt-BR" href="https://paralaxestudio.com.br/pt/">
<link rel="alternate" hreflang="en" href="https://paralaxestudio.com.br/en/">
<link rel="alternate" hreflang="x-default" href="https://paralaxestudio.com.br/pt/">
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#050505;color:#f4f3ee;font-family:system-ui,sans-serif}a{color:#ffe55c;margin:0 12px;font-size:1.1rem}</style>
<script>
(function(){
  var lang='pt';
  try{
    var saved=localStorage.getItem('lang');
    if(saved==='pt'||saved==='en'){lang=saved;}
    else{
      var nav=(navigator.languages&&navigator.languages[0])||navigator.language||'';
      lang=nav.toLowerCase().indexOf('pt')===0?'pt':'en';
    }
  }catch(e){}
  location.replace(lang+'/');
})();
</script>
</head>
<body>
<p><a href="pt/">Português</a> · <a href="en/">English</a></p>
</body>
</html>
